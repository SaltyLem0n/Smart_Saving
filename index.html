<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Savings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // Runs app.py in the browser with stlite (Streamlit on Pyodide), so it can be hosted on GitHub Pages.
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    mount(
      {
        // These models were saved with scikit-learn 1.6.1. Use the Python 3.12
        // browser runtime that supplies its matching WebAssembly build.
        pyodideUrl: "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js",
        requirements: [
          "numpy==2.0.2",
          "scipy==1.14.1",
          "pandas==2.2.3",
          "scikit-learn==1.6.1",
          "joblib==1.6.0",
        ],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "savings_model.joblib": { url: "./savings_model.joblib" },
          "saver_model.joblib": { url: "./saver_model.joblib" },
          "customers_with_groups.csv": { url: "./customers_with_groups.csv" },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
